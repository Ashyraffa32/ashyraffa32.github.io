<script>

  { id:2, x:'26%', y:'19%', label:'Skills', title:'SKILLS', content:`<h3>Engineering</h3><p>Middle Front-End development, performance optimization.</p><h3>Support:</h3><p>IT Support, Personal Troubleshooter.</p><h3>Other</h3><div class="tag-row"><span class="tag">Junior Omori Modder</span><span class="tag">Open source</span><span class="tag">Mentoring</span></div>` },

  { id:3, x:'64%', y:'22%', label:'Experience', title:'EXPERIENCE', content:`<p><span style="color:#bbb">Freelance Developer</span><br><span style="color:#555;font-size:12px">2023 – now</span>` },

  { id:4, x:'11%', y:'37%', label:'Contacts', title:'CONTACT ME', content:`<h3>Reach me</h3><p>GitHub: github.com/Ashyraffa32</p><p>TikTok: @raffa3527</p><h3>Availability</h3><p>Busy with life right now. Not open for a long time.</p>` },

];

function makeDoor(d) {
  const wrap = document.createElement('div');
  wrap.className = 'door-wrap';
  wrap.style.left = d.x;
  wrap.style.top = d.y;
  wrap.setAttribute('data-id', d.id);

  const label = document.createElement('div');
  label.className = 'door-label';
  label.textContent = d.label;

  const svg = `<svg class="door-svg" width="42" height="52" viewBox="0 0 22 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="20" height="30" stroke="#fff" stroke-width="1"/>
    <rect x="15" y="14" width="3" height="3" fill="#fff"/>
  </svg>`;

  wrap.innerHTML = svg;
  wrap.appendChild(label);
  wrap.addEventListener('click', () => openPanel(d));
  return wrap;
}

const room = document.getElementById('room');
doors.forEach(d => room.appendChild(makeDoor(d)));

function openPanel(d) {
  document.getElementById('panel-title').textContent = d.title;
  document.getElementById('panel-body').innerHTML = d.content;
  document.getElementById('overlay').classList.add('active');
}

function closePanel() {
  document.getElementById('overlay').classList.remove('active');
}

document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) closePanel();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePanel();
});
</script>
</body>
