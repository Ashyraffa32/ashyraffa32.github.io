<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ashy's Website</title>
	<link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
	<div class="lockscreen-bg"></div>
	<div class="lockscreen-container">
		<div class="status-bar">
			<span class="no-service">No Service</span>
			<span class="battery">100%</span>
		</div>
		<div class="clock">6:51</div>
		<div class="date">Sunday, October 26</div>
		<div class="notification">
			<div class="notif-title">
				<span class="notif-icon">🛈</span>
				<span class="notif-label">Tips</span>
				<span class="notif-time">now</span>
			</div>
			<div class="notif-content">
				Welcome to my website. to unlock, just swipe the screen. I love Aubrey btw :D<br>
				<span class="notif-link">Press for nothing</span>
			</div>
		</div>
		<div class="home-indicator">
			<span>Swipe to open</span>
		</div>
	</div>
	<script src="script.js"></script>
</body>
</html>
