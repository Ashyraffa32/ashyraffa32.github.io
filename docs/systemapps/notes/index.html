<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ashy's Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</head>
<body>
    <div class="status-bar dark">
        <span id="cellular">No Service</span>
        <span id="time">09:41</span>
        <span id="battery">100%</span>
    </div>

    <div id="notes-list-view" class="view">
        <div class="nav-header">
            <span class="folder-back"><ion-icon name="chevron-back"></ion-icon> Folders</span>
        </div>
        <h1 class="view-title">Notes</h1>
        <div class="search-bar">
            <ion-icon name="search"></ion-icon> Search
        </div>
        <div class="notes-items" id="notes-container">
            </div>
        <div class="toolbar">
            <span class="note-count" id="count-text">0 Notes</span>
            <ion-icon name="create-outline" class="new-note-icon" onclick="createNewNote()"></ion-icon>
        </div>
    </div>

    <div id="notes-editor-view" class="view hidden">
        <div class="nav-header">
            <span class="back-btn" onclick="showList()"><ion-icon name="chevron-back"></ion-icon> Notes</span>
            <span class="share-icon"><ion-icon name="share-outline"></ion-icon> Done</span>
        </div>
        <div class="editor-container">
            <div class="timestamp" id="note-timestamp">October 26, 2026 at 9:41 AM</div>
            <textarea id="note-textarea" spellcheck="false"></textarea>
        </div>
    <div class="toolbar editor-toolbar">
        <ion-icon name="trash-outline" class="delete-btn" onclick="deleteCurrentNote()"></ion-icon>
        <ion-icon name="create-outline" class="new-note-icon" onclick="createNewNote()"></ion-icon>
     </div>
    </div>

    <div id="custom-alert-overlay" class="ios-alert-overlay hidden">
    <div class="ios-alert-box">
        <div class="ios-alert-content">
            <h3 id="alert-title">Delete Note</h3>
            <p id="alert-message">Are you sure you want to delete this note?</p>
        </div>
        <div class="ios-alert-actions">
            <button class="alert-btn cancel" onclick="closeCustomAlert()">Cancel</button>
            <button id="alert-confirm-btn" class="alert-btn confirm">Delete</button>
        </div>
    </div>
</div>

    <script src="notes.js"></script>
    <script src="../script.js"></script>
</body>
</html>
