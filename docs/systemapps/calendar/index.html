<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashy's Website</title>
    <link rel="stylesheet" href="style.css">
    	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</head>
<body>
    <div class="status-bar dark">
        <span id="cellular">No Service</span>
        <span id="time">21:51</span>
        <span id="battery">100%</span>
    </div>

    <div class="calendar-header">
        <div class="header-nav">
            <button class="nav-btn" onclick="moveMonth(-1)"><ion-icon name="chevron-back-outline"></ion-icon></button>
            <div id="monthYearTitle" class="month-title">March 2026</div>
            <button class="nav-btn" onclick="moveMonth(1)"><ion-icon name="chevron-forward-outline"></ion-icon></button>
        </div>
        <div class="days-label">
            <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
    </div>

    <div id="calendarGrid" class="calendar-grid">
        </div>

    <div class="event-viewer">
        <div class="event-section-label">EVENTS</div>
        <div id="eventDescription" class="event-content">
            Select a date to see events.
        </div>
    </div>

    <script src="indexer.js"></script>
    <script src="../script.js"></script>
</body>
</html>
