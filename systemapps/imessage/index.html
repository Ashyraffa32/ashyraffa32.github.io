<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messages</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</head>
<body>
    <div class="status-bar dark">
        <span id="cellular">No Service</span>
        <span id="time">09:41</span>
        <span id="battery">100%</span>
    </div>

    <div id="messages-list-view" class="view">
        <div class="nav-header">
            <span class="edit-btn">Edit</span>
            <span class="compose-btn"><ion-icon name="create-outline"></ion-icon></span>
        </div>
        <h1 class="view-title">Messages</h1>
        <div class="search-bar">
            <ion-icon name="search"></ion-icon> Search
        </div>
        <div class="chat-list" id="chat-list-container">
            </div>
    </div>

    <div id="chat-view" class="view hidden">
        <div class="nav-header chat-header">
            <div class="back-btn" onclick="backToList()">
                <ion-icon name="chevron-back"></ion-icon>
                <span class="back-text">Messages</span>
            </div>
            <div class="contact-name" id="chat-contact-name">Name</div>
            <div class="details-btn">Details</div>
        </div>
        
        <div class="chat-bubbles" id="chat-bubbles-container">
            </div>

        <div class="chat-input-area">
            <ion-icon name="camera" class="input-icon"></ion-icon>
            <div class="input-box" onclick="showSimAlert()">iMessage</div>
            <ion-icon name="mic" class="input-icon"></ion-icon>
        </div>
    </div>

    <div id="sim-alert-overlay" class="alert-overlay hidden">
        <div class="ios-alert">
            <h3>No SIM Card Installed</h3></p>
            <div class="alert-btn" onclick="closeSimAlert()">OK</div>
        </div>
    </div>

    <script src="messages.js"></script>
    <script src="../script.js"></script>
</body>
</html>
