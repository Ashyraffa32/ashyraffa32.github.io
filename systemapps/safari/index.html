<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ashy's Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</head>
<body>
   <body>
    <div class="status-bar dark">
        <span id="cellular">No Service</span>
        <span id="time">10:25</span>
        <span id="battery">100%</span>
    </div>

    <div class="safari-header">
        <div class="address-bar">
            <ion-icon name="refresh-outline" class="refresh-icon" onclick="reloadSafari()"></ion-icon>
            <input type="text" id="safari-input" value="google.com" spellcheck="false" autocomplete="off">
        </div>
    </div>

    <iframe src="favorites.html" id="safari-frame" class="safari-frame"></iframe>

    <div class="safari-toolbar">
        <ion-icon name="chevron-back-outline" onclick="goBack()"></ion-icon>
        <ion-icon name="chevron-forward-outline" onclick="goForward()"></ion-icon>
        <ion-icon name="share-outline"></ion-icon>
        <ion-icon name="book-outline"></ion-icon>
        <ion-icon name="copy-outline"></ion-icon>
    </div>
    
    <script src="../script.js"></script>
    <script src="engine.js"></script>
</body>
</body>
